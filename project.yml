# XcodeGen 定義。`xcodegen generate` で BanmenTask.xcodeproj を生成する。
# Info.plist と .entitlements もここから自動生成されるので、手で書く必要はない。
name: BanmenTask
options:
  # 開発言語は英語。日本語も訳として明示的に持たせる（引き継ぎ書 4-157）
  developmentLanguage: en
  bundleIdPrefix: com.zzzjjj080
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: A7WA598R44
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: false
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "8"

targets:
  # ─────────────────────────── iOS 本体 ───────────────────────────
  BanmenTask:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    info:
      path: iOS/Info.plist
      properties:
        # 訳が無いときの値（英語）。各言語の名前は InfoPlist.xcstrings（Tools/gen-localizations.py が作る）
        CFBundleDisplayName: TaskFace
        # 版はビルド設定から取る。埋め込みの Watch アプリ・拡張と食い違うと審査で弾かれる
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 実機に入っている版を画面に出すための印。install.sh が毎回渡す（引き継ぎ書 4-145）
        BTBuildStamp: "$(BT_BUILD_STAMP)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # v1 で EventKit を使う時に必要。v0 では未使用だが先に入れておく。
        NSRemindersFullAccessUsageDescription: TaskFace reads your reminders to show them on your watch face.
        NSCalendarsFullAccessUsageDescription: TaskFace reads today's upcoming events to show them on your watch face.
        # v3: バックグラウンド更新
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.zzzjjj080.banmentask.refresh]
    entitlements:
      path: iOS/BanmenTask.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzzjjj080.banmentask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzjjj080.banmentask
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: false
    dependencies:
      - target: BanmenTaskWatch
      - target: BanmenTaskHomeWidget

  # ─────────────────────────── iPhone ホーム画面ウィジェット ───────────────────────────
  BanmenTaskHomeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HomeWidget
      - path: Shared
    info:
      path: HomeWidget/Info.plist
      properties:
        # 訳が無いときの値（英語）。各言語の名前は InfoPlist.xcstrings（Tools/gen-localizations.py が作る）
        CFBundleDisplayName: TaskFace
        # 版はビルド設定から取る。埋め込みの Watch アプリ・拡張と食い違うと審査で弾かれる
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 実機に入っている版を画面に出すための印。install.sh が毎回渡す（引き継ぎ書 4-145）
        BTBuildStamp: "$(BT_BUILD_STAMP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSRemindersFullAccessUsageDescription: Used to show your reminders in the Home Screen widget.
    entitlements:
      path: HomeWidget/BanmenTaskHomeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzzjjj080.banmentask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzjjj080.banmentask.homewidget
        TARGETED_DEVICE_FAMILY: "1"

  # ─────────────────────────── Watch アプリ ───────────────────────────
  BanmenTaskWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        # 訳が無いときの値（英語）。各言語の名前は InfoPlist.xcstrings（Tools/gen-localizations.py が作る）
        CFBundleDisplayName: TaskFace
        # 版はビルド設定から取る。埋め込みの Watch アプリ・拡張と食い違うと審査で弾かれる
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 実機に入っている版を画面に出すための印。install.sh が毎回渡す（引き継ぎ書 4-145）
        BTBuildStamp: "$(BT_BUILD_STAMP)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.zzzjjj080.banmentask
        WKWatchOnly: false
    entitlements:
      path: Watch/BanmenTaskWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzzjjj080.banmentask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzjjj080.banmentask.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.zzzjjj080.banmentask
        INFOPLIST_KEY_WKWatchOnly: false
    dependencies:
      - target: BanmenTaskWidget

  # ─────────────────────────── ウィジェット拡張（＝コンプリケーション本体） ───────────────────────────
  BanmenTaskWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidget
      - path: Shared
    info:
      path: WatchWidget/Info.plist
      properties:
        # 訳が無いときの値（英語）。各言語の名前は InfoPlist.xcstrings（Tools/gen-localizations.py が作る）
        CFBundleDisplayName: TaskFace
        # 版はビルド設定から取る。埋め込みの Watch アプリ・拡張と食い違うと審査で弾かれる
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 実機に入っている版を画面に出すための印。install.sh が毎回渡す（引き継ぎ書 4-145）
        BTBuildStamp: "$(BT_BUILD_STAMP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidget/BanmenTaskWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzzjjj080.banmentask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzjjj080.banmentask.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  BanmenTask:
    build:
      targets:
        BanmenTask: all
    run:
      config: Debug
  BanmenTaskWatch:
    build:
      targets:
        BanmenTaskWatch: all
    run:
      config: Debug
